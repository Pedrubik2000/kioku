org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
android.enableR8.fullMode=true
# termux-x11 pins NDK 29; build with the NDK installed locally instead.
termuxX11NdkVersion=30.0.14904198
# Application id. The runtime in assets/bootstrap-aarch64.zip must be built for
# the same id, because Termux binaries hardcode /data/data/<id>/files/usr.
#  - io.krmanik.ankidesk: release id, needs packages rebuilt with
#    TERMUX_APP__PACKAGE_NAME=io.krmanik.ankidesk (tools/build-termux-packages.sh).
#  - io.krmanik: development id; exactly as long as com.termux, so stock Termux
#    binaries can be patched in place by tools/build_rootfs.py.
ankideskApplicationId=io.krmanik
