org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
android.enableR8.fullMode=true
# termux-x11 pins NDK 29; build with the NDK installed locally instead.
termuxX11NdkVersion=30.0.14904198
# Application id. The runtime in assets/bootstrap-aarch64.zip must be built for
# the same id, because Termux binaries hardcode /data/data/<id>/files/usr.
# tools/build_rootfs.py retargets the official Termux packages in place, which
# only works when every path keeps its length: "/data/data/io.ankidesk/file" is
# exactly as long as "/data/data/com.termux/files", so the rootfs directory is
# "file" (the prefix /data/data/io.ankidesk/file/usr).
# Packages rebuilt with TERMUX_APP__PACKAGE_NAME=io.ankidesk
# (tools/build-termux-packages.sh) use the normal "files" instead.
ankideskApplicationId=io.ankidesk
ankideskRootfsDir=file
